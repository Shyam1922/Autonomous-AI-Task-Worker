
services:
  postgres:
    image: postgres:17
    container_name: taskpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot_dev_password
      POSTGRES_DB: taskpilot_db
    ports:
      - "5432:5432"
    volumes:
      - taskpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskpilot_postgres_data:
